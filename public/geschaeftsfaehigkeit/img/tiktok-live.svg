<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: Handy mit einem TikTok-LIVE, daneben fliegen virtuelle Geschenke">
  <!-- Eigene Illustration für WR-Lab (Fall „Rosen für den Streamer“) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1f3d"/><stop offset="1" stop-color="#14121c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f5c"/><stop offset="1" stop-color="#1c1830"/></linearGradient>
    <clipPath id="sc"><rect x="302" y="62" width="196" height="476" rx="22"/></clipPath>
    <path id="herz" d="M0 8 C0 -2 14 -6 20 4 C26 -6 40 -2 40 8 C40 22 20 34 20 34 C20 34 0 22 0 8Z"/>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>
  <!-- Handy -->
  <rect x="288" y="44" width="224" height="512" rx="34" fill="#0d0d12" stroke="#4a4560" stroke-width="5"/>
  <rect x="302" y="62" width="196" height="476" rx="22" fill="url(#screen)"/>
  <g clip-path="url(#sc)">
    <circle cx="400" cy="250" r="50" fill="#f2b8a2"/>
    <path d="M362 222 Q400 170 440 224 Q430 196 400 194 Q368 194 362 222Z" fill="#3a2a22"/>
    <ellipse cx="400" cy="400" rx="104" ry="84" fill="#5b8def"/>
    <rect x="352" y="300" width="96" height="40" rx="20" fill="#5b8def"/>
    <rect x="316" y="452" width="132" height="22" rx="11" fill="#ffffff" opacity=".22"/>
    <rect x="316" y="482" width="102" height="22" rx="11" fill="#ffffff" opacity=".22"/>
    <rect x="316" y="512" width="150" height="22" rx="11" fill="#ffffff" opacity=".22"/>
  </g>
  <!-- LIVE-Anzeige und Match-Balken -->
  <rect x="316" y="78" width="58" height="26" rx="7" fill="#fe2c55"/>
  <text x="345" y="97" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
  <rect x="384" y="78" width="98" height="26" rx="13" fill="#000" opacity=".35"/>
  <circle cx="398" cy="91" r="6" fill="#fff"/>
  <text x="440" y="96" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">1,2 Tsd.</text>
  <rect x="316" y="116" width="168" height="12" rx="6" fill="#25f4ee"/>
  <rect x="316" y="116" width="104" height="12" rx="6" fill="#fe2c55"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" opacity=".9">LIVE-MATCH</text>
  <!-- Fliegende Geschenke -->
  <g fill="#fe2c55"><use href="#herz" transform="translate(560 380) scale(1.3)"/><use href="#herz" transform="translate(610 250) scale(.9)" opacity=".85"/><use href="#herz" transform="translate(540 150) scale(.7)" opacity=".7"/></g>
  <g transform="translate(650 400)"><circle r="20" fill="#ff5c8a"/><circle cx="-14" cy="-8" r="12" fill="#ff7aa0"/><circle cx="14" cy="-8" r="12" fill="#ff7aa0"/><circle cy="-18" r="12" fill="#ff7aa0"/><path d="M0 18 L0 70" stroke="#2fa35a" stroke-width="6"/><path d="M0 46 Q18 34 28 40 Q14 54 0 50Z" fill="#2fa35a"/></g>
  <g transform="translate(150 330)"><circle r="20" fill="#ff5c8a"/><circle cx="-14" cy="-8" r="12" fill="#ff7aa0"/><circle cx="14" cy="-8" r="12" fill="#ff7aa0"/><circle cy="-18" r="12" fill="#ff7aa0"/><path d="M0 18 L0 70" stroke="#2fa35a" stroke-width="6"/><path d="M0 46 Q-18 34 -28 40 Q-14 54 0 50Z" fill="#2fa35a"/></g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7a5200">
    <circle cx="200" cy="170" r="26" fill="#ffc83d" stroke="#e0a100" stroke-width="4"/><text x="200" y="178">C</text>
    <circle cx="120" cy="470" r="22" fill="#ffc83d" stroke="#e0a100" stroke-width="4"/><text x="120" y="478">C</text>
    <circle cx="690" cy="160" r="22" fill="#ffc83d" stroke="#e0a100" stroke-width="4"/><text x="690" y="168">C</text>
