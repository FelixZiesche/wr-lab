<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: Energydrink-Dose neben einem Zettel der Eltern mit der Aufschrift Keine Energydrinks">
  <!-- Eigene Illustration für WR-Lab (Fall „Der verbotene Energydrink“) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe9f5"/><stop offset="1" stop-color="#c3d3e6"/></linearGradient>
    <linearGradient id="dose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d2b3a"/><stop offset=".45" stop-color="#3a5570"/><stop offset="1" stop-color="#16212d"/></linearGradient>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>
  <rect x="0" y="470" width="800" height="130" fill="#a9b9cc"/>
  <!-- Dose -->
  <ellipse cx="300" cy="500" rx="110" ry="22" fill="#8798ad"/>
  <rect x="200" y="140" width="200" height="360" rx="26" fill="url(#dose)"/>
  <ellipse cx="300" cy="140" rx="100" ry="20" fill="#c9d3dd"/>
  <ellipse cx="300" cy="140" rx="70" ry="12" fill="#a6b3c0"/>
  <rect x="285" y="128" width="40" height="14" rx="7" fill="#7f8c99"/>
  <path d="M318 210 L262 320 H300 L282 420 L348 290 H308 L330 210Z" fill="#c6ff3d"/>
  <text x="300" y="460" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#c6ff3d" text-anchor="middle">ENERGY</text>
  <!-- Zettel der Eltern -->
  <g transform="rotate(4 600 280)">
    <rect x="470" y="150" width="260" height="250" fill="#fff59d"/>
    <rect x="560" y="138" width="80" height="26" fill="#ffffff" opacity=".7"/>
    <text x="600" y="215" font-family="Comic Sans MS, Arial, sans-serif" font-size="30" fill="#33302a" text-anchor="middle">Jonas:</text>
    <text x="600" y="265" font-family="Comic Sans MS, Arial, sans-serif" font-size="28" fill="#33302a" text-anchor="middle">Keine</text>
    <text x="600" y="305" font-family="Comic Sans MS, Arial, sans-serif" font-size="28" fill="#33302a" text-anchor="middle">Energydrinks!</text>
    <text x="600" y="360" font-family="Comic Sans MS, Arial, sans-serif" font-size="24" fill="#33302a" text-anchor="middle">Mama &amp; Papa</text>
  </g>
  <circle cx="160" cy="120" r="34" fill="none" stroke="#c62828" stroke-width="10"/>
  <line x1="136" y1="144" x2="184" y2="96" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
</svg>
