# Tests mit Playwright und dem Firebase-Emulator (wird von deploy.yml und preview.yml aufgerufen).
name: Tests
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Browser für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Emulatoren zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: Tests (Einzelspiel, Live-Klassenraum, Sicherheitsregeln)
        run: npm test
      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
